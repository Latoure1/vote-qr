<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16243F">
<title>Vote</title>
<style>
  :root{
    --navy:#16243F;--navy2:#1E3358;--orange:#E07B2C;--paper:#F6F4EF;
    --ink:#1b2436;--muted:#6b7890;--line:#e3e0d8;--ok:#1f8a52;--err:#c43d2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);
    min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 1.1rem env(safe-area-inset-bottom)}
  header{padding:1.4rem 0 .4rem;display:flex;align-items:center;gap:.6rem}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;
    color:var(--orange);font-weight:800}
  .brand{font-weight:700}
  main{flex:1;display:flex;flex-direction:column;gap:1.1rem;padding:1rem 0 2rem}
  .screen{display:none}.screen.active{display:flex;flex-direction:column;gap:1.1rem}
  h1{font-size:1.5rem;line-height:1.2}.sub{color:var(--muted);font-size:1rem}
  label{display:block;font-weight:600;margin-bottom:.4rem}
  input{width:100%;padding:1rem;border:1.5px solid var(--line);border-radius:14px;font-size:1.3rem;
    text-align:center;letter-spacing:.15em;text-transform:uppercase;font-family:ui-monospace,monospace;background:#fff}
  input:focus{outline:3px solid rgba(224,123,44,.35);border-color:var(--orange)}
  .btn{border:0;border-radius:16px;padding:1.1rem;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;
    background:var(--orange);color:#fff;font-family:inherit}
  .btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.55}
  .btn-navy{background:var(--navy)}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;cursor:pointer;padding:.5rem;font-family:inherit}
  .msg{font-size:.95rem;min-height:1.2em;text-align:center}.msg.err{color:var(--err)}

  .count{position:sticky;top:0;background:var(--paper);padding:.5rem 0;z-index:2;
    display:flex;align-items:center;gap:.5rem;font-weight:700}
  .count .badge{background:var(--navy);color:#fff;border-radius:99px;padding:.3rem .8rem;font-size:.95rem}
  .cand{display:flex;align-items:center;gap:.8rem;padding:1rem;border:2px solid var(--line);
    border-radius:14px;background:#fff;cursor:pointer;font-size:1.05rem;transition:border-color .1s}
  .cand:active{transform:scale(.995)}
  .cand.sel{border-color:var(--orange);background:#fff7f0}
  .cand .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;
    display:grid;place-items:center;color:#fff;font-size:.9rem}
  .cand.sel .check{background:var(--orange);border-color:var(--orange)}
  .cand.disabled{opacity:.45;pointer-events:none}

  .confirm-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem}
  .confirm-box ul{list-style:none;margin:.6rem 0}
  .confirm-box li{padding:.6rem .2rem;border-bottom:1px solid var(--line);font-weight:600;font-size:1.05rem}
  .confirm-box li:last-child{border-bottom:0}

  .result{border-radius:20px;padding:2.2rem 1.5rem;text-align:center;color:#fff}
  .result.ok{background:var(--ok)}.result.err{background:var(--err)}
  .result .ico{font-size:3rem}.result .big{font-size:1.4rem;font-weight:800;margin:.4rem 0}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:1rem 0}
</style>
</head>
<body>
  <header><div class="logo">V</div><span class="brand">Vote</span></header>
  <main>

    <!-- 1 : code -->
    <section id="s-code" class="screen active">
      <div><h1>Entre ton code</h1><p class="sub">Le code personnel qui t'a été remis.</p></div>
      <div>
        <input id="code" placeholder="XXX-XXX" autocomplete="off" maxlength="7" inputmode="text">
      </div>
      <button class="btn" id="code-go">Continuer</button>
      <p class="msg" id="code-msg"></p>
    </section>

    <!-- 2 : sélection -->
    <section id="s-vote" class="screen">
      <div><h1 id="v-titre">Vote</h1>
        <p class="sub" id="v-sub"></p></div>
      <div class="count"><span class="badge" id="v-count">0 / 3</span><span id="v-hint">choisis 3 personnes</span></div>
      <div id="v-list" style="display:flex;flex-direction:column;gap:.6rem"></div>
      <button class="btn" id="v-go" disabled>Continuer</button>
    </section>

    <!-- 3 : confirmation -->
    <section id="s-confirm" class="screen">
      <div><h1>Confirme ton vote</h1><p class="sub">Vérifie tes 3 choix. C'est définitif.</p></div>
      <div class="confirm-box"><ul id="c-list"></ul></div>
      <button class="btn btn-navy" id="c-go">Voter définitivement</button>
      <button class="link" id="c-back">← Modifier mes choix</button>
      <p class="msg" id="c-msg"></p>
    </section>

    <!-- 4 : résultat -->
    <section id="s-done" class="screen">
      <div class="result ok" id="r-card">
        <div class="ico" id="r-ico">✓</div>
        <div class="big" id="r-msg"></div>
      </div>
    </section>

  </main>
  <footer>Vote anonyme et sécurisé</footer>

<script>
  /* ⬇️ REMPLACE par l'URL /exec de TON déploiement Apps Script */
  var API_URL = "https://script.google.com/macros/s/AKfycbwiTK6OPgWEYN6RYvu_-ztVREM3hS3SBNHt6TBlCHjM4G5YS4JPQoJLCJsN5CRSUIs/exec";
  var NB = 3;

  var $=function(id){return document.getElementById(id);};
  function show(name){
    ['code','vote','confirm','done'].forEach(function(s){
      $('s-'+s).classList.toggle('active', s===name);
    });
    window.scrollTo(0,0);
  }

  var CODE='', CANDIDATS=[], SELECTION=[];

  /* auto-format XXX-XXX */
  $('code').addEventListener('input', function(){
    var v=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(v.length>3) v=v.slice(0,3)+'-'+v.slice(3,6);
    this.value=v;
  });

  /* étape 1 : valider le code, charger les candidats */
  $('code-go').onclick=function(){
    var code=$('code').value.trim().toUpperCase();
    if(code.length<7){$('code-msg').className='msg err';$('code-msg').textContent='Code incomplet.';return;}
    $('code-go').disabled=true;$('code-msg').className='msg';$('code-msg').textContent='Vérification…';
    fetch(API_URL+'?action=candidats&code='+encodeURIComponent(code))
      .then(function(r){return r.json();})
      .then(function(d){
        $('code-go').disabled=false;
        if(d.status!=='ok'){$('code-msg').className='msg err';$('code-msg').textContent=d.message;return;}
        CODE=code; CANDIDATS=d.candidats; NB=d.nbChoix||3; SELECTION=[];
        $('v-titre').textContent=d.titre;
        $('v-sub').textContent='Bonjour '+d.electeur+' — choisis exactement '+NB+' personnes.';
        $('v-hint').textContent='choisis '+NB+' personnes';
        renderList();
        show('vote');
      })
      .catch(function(){$('code-go').disabled=false;$('code-msg').className='msg err';$('code-msg').textContent='Connexion impossible. Réessaie.';});
  };
  $('code').addEventListener('keydown',function(e){if(e.key==='Enter')$('code-go').click();});

  /* étape 2 : liste des candidats */
  function renderList(){
    var box=$('v-list'); box.innerHTML='';
    CANDIDATS.forEach(function(nom){
      var sel=SELECTION.indexOf(nom)>-1;
      var full=SELECTION.length>=NB && !sel;
      var d=document.createElement('div');
      d.className='cand'+(sel?' sel':'')+(full?' disabled':'');
      d.innerHTML='<span class="check">'+(sel?'✓':'')+'</span><span>'+nom.replace(/</g,'&lt;')+'</span>';
      d.onclick=function(){ toggle(nom); };
      box.appendChild(d);
    });
    updateCount();
  }
  function toggle(nom){
    var i=SELECTION.indexOf(nom);
    if(i>-1) SELECTION.splice(i,1);
    else { if(SELECTION.length>=NB) return; SELECTION.push(nom); }
    renderList();
  }
  function updateCount(){
    $('v-count').textContent=SELECTION.length+' / '+NB;
    $('v-go').disabled=SELECTION.length!==NB;
  }
  $('v-go').onclick=function(){
    var ul=$('c-list'); ul.innerHTML='';
    SELECTION.forEach(function(nom){
      var li=document.createElement('li'); li.textContent='★ '+nom; ul.appendChild(li);
    });
    $('c-msg').textContent='';
    show('confirm');
  };
  $('c-back').onclick=function(){show('vote');};

  /* étape 3 : envoi du vote */
  $('c-go').onclick=function(){
    $('c-go').disabled=true;$('c-msg').className='msg';$('c-msg').textContent='Enregistrement…';
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({code:CODE,choix:SELECTION})})
      .then(function(r){return r.json();})
      .then(function(d){ done(d); })
      .catch(function(){ done({status:'error',message:'Connexion impossible. Réessaie.'}); $('c-go').disabled=false; });
  };

  function done(d){
    var ok=d.status==='ok';
    $('r-card').className='result '+(ok?'ok':'err');
    $('r-ico').textContent=ok?'✓':'✕';
    $('r-msg').textContent=d.message||(ok?'Vote enregistré':'Échec');
    if(ok) show('done');
    else { $('c-go').disabled=false; $('c-msg').className='msg err'; $('c-msg').textContent=d.message; }
  }
</script>
</body>
</html>
